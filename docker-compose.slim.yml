services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.slim
    image: ispgo-app
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      WWWUSER: '${WWWUSER}'
    volumes:
      - '.:/var/www/html'
    networks:
      - ispgo
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "docker-php-ext-install pcntl 2>/dev/null;
             php artisan key:generate --force;
             php artisan storage:link 2>/dev/null;
             php artisan serve --host=0.0.0.0 --port=80"

  mysql:
    image: 'mariadb:10.8'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-ispgo}'
      MYSQL_USER: '${DB_USERNAME:-sail}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'ispgo-mysql:/var/lib/mysql'
    networks:
      - ispgo
    healthcheck:
      test:
        - CMD
        - mariadb-admin
        - ping
        - '-p${DB_PASSWORD:-password}'
      retries: 3
      timeout: 5s

  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'ispgo-redis:/data'
    networks:
      - ispgo
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - ispgo

  meilisearch:
    image: 'getmeili/meilisearch:latest'
    ports:
      - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
    environment:
      MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
    volumes:
      - 'ispgo-meilisearch:/meili_data'
    networks:
      - ispgo

networks:
  ispgo:
    driver: bridge

volumes:
  ispgo-mysql:
    driver: local
  ispgo-redis:
    driver: local
  ispgo-meilisearch:
    driver: local
